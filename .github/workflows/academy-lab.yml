name: Academy Lab checks
on:
  push:
    branches: ['academy-*', 'academyhub-v0.3']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: academy-cpp-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure and build
        run: |
          cmake -S academy-lab -B academy-lab/build
          cmake --build academy-lab/build
      - name: Check starter smoke test
        if: github.ref == 'refs/heads/academyhub-v0.3'
        run: ctest --test-dir academy-lab/build -R smoke --output-on-failure
      - name: Check student solution
        if: github.ref != 'refs/heads/academyhub-v0.3'
        run: ctest --test-dir academy-lab/build --output-on-failure
